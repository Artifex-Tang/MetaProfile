# 默认形态:纯 HTTP(无证书时使用)。
# 拿到证书后由 enable_https.sh 换成 default.https.conf.template 渲染出的版本。
server {
    listen 80;
    server_name _;

    # certbot HTTP-01 challenge(webroot 模式;签发期间必须经 80 可达)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/conf.d/locations.inc;
}
