name: metaprofile-readonly

# 云上只读轻量栈:去 Doris/ES/rabbitmq/litellm/worker。
# 留 postgres/neo4j/redis/migrate/backend(frontend)。
# MODE=readonly → readonly_guard 熔断 ODS/采集/LLM/画像写。
# 数据由 mock_data.sql + mock_data.cypher 灌(部署步骤,非 seed 服务)。
#
# 启动(云 ECS,repo root):
#   cd deploy && docker compose -f docker-compose.readonly.yml up -d
# 灌数据(起栈后):
#   docker compose -f docker-compose.readonly.yml exec -T postgres \
#     psql -U metaprofile -d metaprofile < mock_data.sql
#   cat mock_data.cypher | docker compose -f docker-compose.readonly.yml exec -T neo4j \
#     cypher-shell -u neo4j -p "$NEO4J_PASSWORD" --format plain

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: metaprofile
      POSTGRES_USER: metaprofile
      POSTGRES_PASSWORD: ${PG_PASSWORD:-metaprofile}
    ports: ["127.0.0.1:5432:5432"]   # 只绑回环:外部访问走 SSH 隧道,不靠安全组兜底
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaprofile -d metaprofile"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 8

  neo4j:
    image: neo4j:5.16
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 4G   # 32G 机给 4G heap
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: [neo4jdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    image: metaprofile-backend:latest
    command: python -m alembic upgrade head
    environment:
      POSTGRES_DSN: "postgresql+asyncpg://metaprofile:${PG_PASSWORD:-metaprofile}@postgres:5432/metaprofile"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: metaprofile-backend:latest
    command: uvicorn metaprofile.backend.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports: ["127.0.0.1:8000:8000"]   # 对外只经 nginx :80/:443
    environment:
      MODE: readonly   # ← 触发 readonly_guard 熔断
      POSTGRES_DSN: "postgresql+asyncpg://metaprofile:${PG_PASSWORD:-metaprofile}@postgres:5432/metaprofile"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-password}"
      NEO4J_DATABASE: "neo4j"
      REDIS_DSN: "redis://redis:6379/0"
      PROFILE_API_TECH_BASE_URL: "http://backend:8000"
      PROFILE_API_PROJECT_BASE_URL: "http://backend:8000"
      PROFILE_API_ORG_BASE_URL: "http://backend:8000"
      PROFILE_API_PERSON_BASE_URL: "http://backend:8000"
      # MCP 服务(/mcp)。留空=关 DNS rebinding 防护(经 nginx 反代,Host 是部署域名);
      # 配了域名则只放行该 Host。多个用逗号分隔。
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-}"
      # MCP Bearer token。deploy.sh 首次部署会生成一个写进 .env;留空则不鉴权。
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN:-}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 8

  frontend:
    image: metaprofile-frontend:latest
    ports: ["80:80", "443:443"]
    volumes:
      - /data/dist:/usr/share/nginx/html:ro   # bind mount dist(免 rebuild 镜像)
      - /data/nginx:/etc/nginx/conf.d:ro         # bind mount 整个 conf.d(default.conf + locations.inc;免 rebuild 改 proxy/HTTPS)
      - /data/certs:/etc/nginx/certs:ro         # TLS 证书(enable_https.sh 签发后放这;无证书时 nginx.conf 不引用,空目录无害)
      - /data/certbot:/var/www/certbot          # certbot HTTP-01 challenge webroot
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/index.html || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
  neo4jdata:
